<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAwesome - Online Spillere</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --input-bg: #181818;
            --hover-bg: #222222;
            --text-main: #f4f4f5;
            --text-muted: #8e8e93;
            --border: #262626;
            --active-bg: #e4e4e7;
            --active-text: #09090b;
            --vip-bg: #f59e0b;
            --pro-bg: #a855f7;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 20px;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stats {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .refresh-btn:hover {
            background-color: var(--hover-bg);
            border-color: #3f3f46;
        }

        /* Filter Box */
        .filter-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 24px;
        }

        .filter-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 240px;
            max-width: 380px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-wrapper input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .search-wrapper input:focus {
            border-color: #52525b;
        }

        .clear-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: color 0.15s, background-color 0.15s;
        }

        .clear-btn:hover {
            color: var(--text-main);
            background-color: var(--input-bg);
        }

        .filter-bottom {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .pill-btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .pill-btn:hover {
            background-color: var(--hover-bg);
            border-color: #3f3f46;
        }

        .pill-btn.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            border-color: var(--active-bg);
        }

        /* Custom søgbar Server Dropdown */
        .dropdown-wrapper {
            position: relative;
            min-width: 210px;
        }

        .dropdown-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .dropdown-trigger:hover,
        .dropdown-wrapper.open .dropdown-trigger {
            background-color: var(--hover-bg);
            border-color: #3f3f46;
        }

        .dropdown-trigger svg {
            color: var(--text-muted);
            transition: transform 0.15s;
            flex-shrink: 0;
        }

        .dropdown-wrapper.open .dropdown-trigger svg {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 260px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .dropdown-wrapper.open .dropdown-menu {
            display: flex;
        }

        .dropdown-search {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            background-color: var(--input-bg);
        }

        .dropdown-search input {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 0.82rem;
            outline: none;
        }

        .dropdown-search input:focus {
            border-color: #52525b;
        }

        .dropdown-list {
            max-height: 240px;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dropdown-list::-webkit-scrollbar {
            width: 6px;
        }

        .dropdown-list::-webkit-scrollbar-thumb {
            background: #2e2e32;
            border-radius: 3px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.84rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .dropdown-item:hover {
            background-color: var(--hover-bg);
        }

        .dropdown-item.selected {
            background-color: var(--active-bg);
            color: var(--active-text);
            font-weight: 700;
        }

        .dropdown-count {
            font-size: 0.74rem;
            padding: 1px 6px;
            border-radius: 999px;
            background-color: var(--input-bg);
            color: var(--text-muted);
            font-weight: 600;
        }

        .dropdown-item.selected .dropdown-count {
            background-color: rgba(0, 0, 0, 0.12);
            color: var(--active-text);
        }

        .dropdown-divider {
            height: 1px;
            background-color: var(--border);
            margin: 4px 0;
        }

        /* Player Grid */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.15s, border-color 0.15s, background-color 0.15s;
        }

        .player-card:hover {
            transform: translateY(-2px);
            border-color: #3f3f46;
            background-color: #161616;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background-color: var(--input-bg);
            image-rendering: pixelated;
            border: 1px solid var(--border);
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .username {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #fff;
            flex-shrink: 0;
        }

        .badge-vip { background-color: var(--vip-bg); }
        .badge-pro { background-color: var(--pro-bg); }

        /* Klikbart UUID med tooltip */
        .uuid-wrapper {
            position: relative;
            margin-top: 2px;
            display: flex;
            align-items: center;
        }

        .uuid {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 100%;
            font-size: 0.68rem;
            color: #52525b;
            padding: 2px 5px;
            margin-left: -5px;
            border-radius: 5px;
            cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: color 0.15s, background-color 0.15s;
        }

        .uuid-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .uuid-icon {
            width: 11px;
            height: 11px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .uuid:hover {
            color: var(--text-main);
            background-color: var(--input-bg);
        }

        .uuid:hover .uuid-icon {
            opacity: 1;
        }

        .uuid.copied {
            color: var(--success);
            background-color: rgba(34, 197, 94, 0.1);
        }

        .uuid.copied .uuid-icon {
            opacity: 1;
        }

        /* Hover Tooltip over UUID */
        .uuid-tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            background-color: #1f1f23;
            color: var(--text-main);
            border: 1px solid #3f3f46;
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 0.72rem;
            line-height: 1.35;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.15s, transform 0.15s;
            z-index: 50;
        }

        .uuid-tooltip .tooltip-hint {
            display: block;
            color: var(--text-muted);
            font-size: 0.66rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin-bottom: 1px;
        }

        .uuid-tooltip .tooltip-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: var(--text-main);
        }

        .uuid-wrapper:hover .uuid-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        .uuid-wrapper.is-copied .uuid-tooltip {
            border-color: rgba(34, 197, 94, 0.5);
        }

        .uuid-wrapper.is-copied .tooltip-hint {
            color: var(--success);
            font-weight: 600;
        }

        .server-name {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .server-name strong {
            color: #d4d4d8;
            font-weight: 600;
        }

        .message {
            text-align: center;
            padding: 40px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div>
            <h1>SuperAwesome Online Spillere</h1>
            <div class="stats" id="stats">Indlæser data...</div>
        </div>
        <button class="refresh-btn" onclick="fetchPlayers()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Opdater
        </button>
    </div>

    <div class="filter-box">
        <div class="filter-top">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Søg efter spiller eller server...">
            </div>
            <button class="clear-btn" onclick="resetFilters()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Ryd filtre
            </button>
        </div>

        <div class="filter-bottom">
            <div class="filter-group">
                <span class="filter-label">RANK</span>
                <div class="pill-group" id="rankPills">
                    <button class="pill-btn active" data-rank="all">Alle</button>
                    <button class="pill-btn" data-rank="pro">PRO</button>
                    <button class="pill-btn" data-rank="vip">VIP</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label">SERVER</span>
                <div class="dropdown-wrapper" id="serverDropdown">
                    <button type="button" class="dropdown-trigger" id="serverDropdownBtn">
                        <span id="serverDropdownLabel">Alle servere</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-search">
                            <input type="text" id="serverDropdownSearch" placeholder="Find server...">
                        </div>
                        <div class="dropdown-list" id="serverDropdownList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="content">
        <div class="message">Henter spillere fra API...</div>
    </div>
</div>

<script>
    const API_URL = 'https://api.superawesome.dk/servers?size=100&status=online';
    let allPlayers = [];
    let serverList = [];
    let selectedServer = 'all';
    let selectedRank = 'all';

    const COPY_ICON_SVG = `<svg class="uuid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const CHECK_ICON_SVG = `<svg class="uuid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    function getEffectiveRank(player) {
        if (player.pro) return 'pro';
        if (player.vip) return 'vip';
        return 'default';
    }

    function getRankWeight(player) {
        if (player.pro) return 3;
        if (player.vip) return 2;
        return 1;
    }

    function formatServerName(name) {
        return name.charAt(0).toUpperCase() + name.slice(1);
    }

    async function copyUuid(wrapperEl, uuid) {
        try {
            await navigator.clipboard.writeText(uuid);
        } catch {
            const tempInput = document.createElement('input');
            tempInput.value = uuid;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
        }

        const uuidBtn = wrapperEl.querySelector('.uuid');
        const hintEl = wrapperEl.querySelector('.tooltip-hint');
        const iconEl = wrapperEl.querySelector('.uuid-icon');

        wrapperEl.classList.add('is-copied');
        uuidBtn.classList.add('copied');
        hintEl.textContent = 'Kopieret til udklipsholder!';
        if (iconEl) iconEl.outerHTML = CHECK_ICON_SVG;

        clearTimeout(wrapperEl._copyTimeout);
        wrapperEl._copyTimeout = setTimeout(() => {
            wrapperEl.classList.remove('is-copied');
            uuidBtn.classList.remove('copied');
            hintEl.textContent = 'Klik for at kopiere UUID';
            const currentIcon = wrapperEl.querySelector('.uuid-icon');
            if (currentIcon) currentIcon.outerHTML = COPY_ICON_SVG;
        }, 1800);
    }

    async function fetchPlayers() {
        const contentDiv = document.getElementById('content');
        const statsDiv = document.getElementById('stats');
        contentDiv.innerHTML = '<div class="message">Henter data fra SuperAwesome API...</div>';

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Kunne ikke hente data fra API');
            
            const servers = await response.json();
            allPlayers = [];
            const serverCounts = new Map();

            servers.forEach(server => {
                const count = Array.isArray(server.playersData) ? server.playersData.length : 0;
                serverCounts.set(server.name, count);

                if (count > 0) {
                    server.playersData.forEach(player => {
                        allPlayers.push({
                            ...player,
                            serverName: server.name
                        });
                    });
                }
            });

            serverList = Array.from(serverCounts.entries())
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'da'));

            if (selectedServer !== 'all' && !serverCounts.has(selectedServer)) {
                selectedServer = 'all';
            }

            updateDropdownLabel();
            renderServerDropdown();

            const activeCount = serverList.filter(s => s.count > 0).length;
            statsDiv.textContent = `${allPlayers.length} online spillere på ${activeCount} aktive servere (ud af ${servers.length} online servere)`;
            renderPlayers();

        } catch (error) {
            console.error(error);
            contentDiv.innerHTML = `<div class="message" style="color: #ef4444;">Fejl ved hentning af data: ${error.message}.<br><small>Bemærk: Hvis du åbner filen lokalt, kan browserens CORS-regler blokere kaldet.</small></div>`;
            statsDiv.textContent = 'Fejl ved indlæsning';
        }
    }

    function updateDropdownLabel() {
        const label = document.getElementById('serverDropdownLabel');
        if (selectedServer === 'all') {
            label.textContent = `Alle servere (${allPlayers.length})`;
        } else {
            const srv = serverList.find(s => s.name === selectedServer);
            label.textContent = srv ? `${formatServerName(srv.name)} (${srv.count})` : formatServerName(selectedServer);
        }
    }

    function renderServerDropdown() {
        const listEl = document.getElementById('serverDropdownList');
        const filterText = document.getElementById('serverDropdownSearch').value.toLowerCase().trim();
        listEl.innerHTML = '';

        if ('alle servere'.includes(filterText) || filterText === '') {
            const allItem = document.createElement('button');
            allItem.type = 'button';
            allItem.className = `dropdown-item ${selectedServer === 'all' ? 'selected' : ''}`;
            allItem.innerHTML = `
                <span>Alle servere</span>
                <span class="dropdown-count">${allPlayers.length}</span>
            `;
            allItem.addEventListener('click', () => selectServer('all'));
            listEl.appendChild(allItem);

            const divider = document.createElement('div');
            divider.className = 'dropdown-divider';
            listEl.appendChild(divider);
        }

        const matchingServers = serverList.filter(s => s.name.toLowerCase().includes(filterText));

        if (matchingServers.length === 0) {
            const empty = document.createElement('div');
            empty.style.cssText = 'padding: 12px; text-align: center; font-size: 0.82rem; color: var(--text-muted);';
            empty.textContent = 'Ingen servere fundet';
            listEl.appendChild(empty);
            return;
        }

        matchingServers.forEach(srv => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = `dropdown-item ${selectedServer === srv.name ? 'selected' : ''}`;
            item.innerHTML = `
                <span>${formatServerName(srv.name)}</span>
                <span class="dropdown-count">${srv.count}</span>
            `;
            item.addEventListener('click', () => selectServer(srv.name));
            listEl.appendChild(item);
        });
    }

    function selectServer(serverName) {
        selectedServer = serverName;
        updateDropdownLabel();
        renderServerDropdown();
        document.getElementById('serverDropdown').classList.remove('open');
        renderPlayers();
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('serverDropdownSearch').value = '';
        selectedServer = 'all';
        selectedRank = 'all';

        document.querySelectorAll('#rankPills .pill-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.rank === 'all');
        });

        updateDropdownLabel();
        renderServerDropdown();
        renderPlayers();
    }

    function renderPlayers() {
        const contentDiv = document.getElementById('content');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

        const filtered = allPlayers.filter(player => {
            const matchesSearch = searchTerm === '' || 
                player.username.toLowerCase().includes(searchTerm) || 
                player.serverName.toLowerCase().includes(searchTerm);

            const matchesServer = selectedServer === 'all' || player.serverName === selectedServer;
            const matchesRank = selectedRank === 'all' || getEffectiveRank(player) === selectedRank;
            
            return matchesSearch && matchesServer && matchesRank;
        });

        // Automatisk sortering efter rank (PRO > VIP > Standard) som standard, da sorteringssektionen er fjernet
        filtered.sort((a, b) => {
            let comparison = getRankWeight(b) - getRankWeight(a);
            if (comparison === 0) {
                comparison = a.username.localeCompare(b.username, 'da');
            }
            return comparison;
        });

        if (filtered.length === 0) {
            contentDiv.innerHTML = '<div class="message">Ingen spillere matchede dine filtre.</div>';
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'player-grid';

        filtered.forEach(player => {
            const card = document.createElement('div');
            card.className = 'player-card';

            const avatarUrl = `https://skins.mcstats.com/face/${player.uuid}`;

            let badgeHtml = '';
            if (player.pro) {
                badgeHtml = '<span class="badge badge-pro">PRO</span>';
            } else if (player.vip) {
                badgeHtml = '<span class="badge badge-vip">VIP</span>';
            }

            card.innerHTML = `
                <img class="avatar" src="${avatarUrl}" alt="${player.username}" loading="lazy">
                <div class="player-info">
                    <div class="user-row">
                        <div class="username">${player.username}</div>
                        ${badgeHtml}
                    </div>
                    <div class="uuid-wrapper">
                        <div class="uuid-tooltip">
                            <span class="tooltip-hint">Klik for at kopiere UUID</span>
                            <span class="tooltip-val">${player.uuid}</span>
                        </div>
                        <div class="uuid" role="button" tabindex="0">
                            <span class="uuid-text">${player.uuid}</span>
                            ${COPY_ICON_SVG}
                        </div>
                    </div>
                    <div class="server-name">Server: <strong>${player.serverName}</strong></div>
                </div>
            `;

            const uuidWrapper = card.querySelector('.uuid-wrapper');
            const uuidEl = card.querySelector('.uuid');
            uuidEl.addEventListener('click', () => copyUuid(uuidWrapper, player.uuid));
            uuidEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    copyUuid(uuidWrapper, player.uuid);
                }
            });

            grid.appendChild(card);
        });

        contentDiv.innerHTML = '';
        contentDiv.appendChild(grid);
    }

    // Dropdown åbn/luk og klik udenfor
    const dropdownWrapper = document.getElementById('serverDropdown');
    document.getElementById('serverDropdownBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dropdownWrapper.classList.toggle('open');
        if (isOpen) {
            const searchBox = document.getElementById('serverDropdownSearch');
            searchBox.value = '';
            renderServerDropdown();
            searchBox.focus();
        }
    });

    document.getElementById('serverDropdownSearch').addEventListener('input', renderServerDropdown);

    document.addEventListener('click', (e) => {
        if (!dropdownWrapper.contains(e.target)) {
            dropdownWrapper.classList.remove('open');
        }
    });

    // Øvrige event listeners
    document.getElementById('searchInput').addEventListener('input', renderPlayers);

    document.querySelectorAll('#rankPills .pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#rankPills .pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedRank = btn.dataset.rank;
            renderPlayers();
        });
    });

    // Kør ved opstart
    fetchPlayers();
</script>

</body>
</html>
